services:
  - type: pserv
    name: floatx-api
    runtime: python
    plan: 1c-2g
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn floatx.main:app --host 0.0.0.0 --port 8000
    disk:
      name: floatx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLOATX_DATA_DIR
        value: /var/data/floatx
      # AI generation stays disabled on an unauthenticated public demo.
      - key: FLOATX_AI_PROVIDER
        value: none

  - type: web
    name: floatx-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: ARGO_API_URL
        fromService:
          name: floatx-api
          type: pserv
          property: hostport
