services:
  - type: web
    name: floatx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn floatx.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLOATX_DATA_DIR
        value: ./data
      - key: FLOATX_AI_PROVIDER
        value: none

  - type: web
    name: floatx-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: ARGO_API_URL
        fromService:
          name: floatx-api
          type: web
          property: host
